name: SnapFlow Manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "9 3 * * *"
  pull_request:
    branches: ["**"]
    paths:
      - ".github/workflows/manifests.yml"
      - "SnapFlow/k8s/**"
      - "SnapFlow/V3-Microservices/docker-compose*.yml"
      - "SnapFlow/**/*.sh"
      - "SnapFlow/**/*.ps1"
  push:
    branches: ["main", "master", "develop"]

concurrency:
  group: snapflow-manifests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TRIVY_IMAGE: aquasec/trivy:0.72.0

jobs:
  validate:
    name: Validate Manifests And Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Kubernetes schema validation
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" ghcr.io/yannh/kubeconform:latest \
            -strict \
            -summary \
            -ignore-missing-schemas \
            /repo/SnapFlow/k8s

      - name: Trivy config scan
        run: |
          mkdir -p trivy-results
          docker run --rm -v "${{ github.workspace }}:/repo" -v "$HOME/.cache/trivy:/root/.cache" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --ignorefile /repo/.trivyignore \
            --format table \
            /repo/SnapFlow
          docker run --rm -v "${{ github.workspace }}:/repo" -v "$HOME/.cache/trivy:/root/.cache" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            --ignorefile /repo/.trivyignore \
            --format sarif \
            --output /repo/trivy-results/config.sarif \
            /repo/SnapFlow
          docker run --rm -v "${{ github.workspace }}:/repo" -v "$HOME/.cache/trivy:/root/.cache" "$TRIVY_IMAGE" config \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignorefile /repo/.trivyignore \
            --format json \
            --output /repo/trivy-results/config.json \
            /repo/SnapFlow

      - name: Trivy config summary
        if: always()
        run: |
          {
            echo "## Trivy Config"
            echo
            echo "| Target | ID | Severity | Title |"
            echo "|---|---|---|---|"
            if [ -s trivy-results/config.json ]; then
              jq -r '
                [.Results[]? as $r | $r.Misconfigurations[]? |
                  ["`" + ($r.Target // "-") + "`", (.ID // "-"), (.Severity // "-"), ((.Title // "-") | gsub("\\|"; "\\\\|"))]
                  | @tsv] | .[]
              ' trivy-results/config.json | while IFS=$'\t' read -r target id severity title; do
                echo "| $target | $id | $severity | $title |"
              done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Trivy config artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config
          path: trivy-results/
          if-no-files-found: ignore

      - name: Bash syntax check
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r script; do
            bash -n "$script"
          done < <(find SnapFlow -name '*.sh' -not -path '*/node_modules/*')

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          Get-ChildItem -Path SnapFlow -Recurse -Filter *.ps1 |
            Where-Object { $_.FullName -notmatch 'node_modules' } |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors.Count -gt 0) {
                $errors | ForEach-Object { Write-Error $_ }
                exit 1
              }
            }

name: SnapFlow CI

on:
  workflow_dispatch:
    inputs:
      scope:
        description: "Which test surface should run?"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - frontend
          - backend
          - quick
      run_security:
        description: "Run lightweight secret/dependency scanning"
        required: true
        default: true
        type: boolean
      run_build:
        description: "Build the frontend production bundle"
        required: true
        default: true
        type: boolean
  pull_request:
    branches: ["**"]
  push:
    branches: ["main", "master", "develop"]

concurrency:
  group: snapflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.11"
  GO_VERSION: "1.25.12"
  FRONTEND_DIR: SnapFlow/Front-Snap
  SERVICES_DIR: SnapFlow/V3-Microservices
  VITE_SUPABASE_URL: http://127.0.0.1:54321
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key

jobs:
  detect-changes:
    name: Stage 0 - Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      ci: ${{ steps.filter.outputs.ci }}
      scope: ${{ steps.scope.outputs.scope }}
      run_security: ${{ steps.scope.outputs.run_security }}
      run_build: ${{ steps.scope.outputs.run_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve requested scope
        id: scope
        shell: bash
        run: |
          echo "scope=${{ github.event.inputs.scope || 'full' }}" >> "$GITHUB_OUTPUT"
          echo "run_security=${{ github.event.inputs.run_security || 'true' }}" >> "$GITHUB_OUTPUT"
          echo "run_build=${{ github.event.inputs.run_build || 'true' }}" >> "$GITHUB_OUTPUT"

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi

          changed="$(git diff --name-only "$base" HEAD || true)"
          echo "$changed"

          mark() {
            local name="$1"
            local regex="$2"
            if [[ -z "$changed" ]] || echo "$changed" | grep -Eq "$regex"; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          }

          mark frontend '(^SnapFlow/Front-Snap/|^\.github/workflows/)'
          mark backend '(^SnapFlow/V3-Microservices/|^SnapFlow/k8s/|^\.github/workflows/)'
          mark ci '(^\.github/workflows/)'

      - name: Stage summary
        shell: bash
        run: |
          {
            echo "## SnapFlow CI"
            echo
            echo "| Area | Changed |"
            echo "|---|---:|"
            echo "| Frontend | ${{ steps.filter.outputs.frontend }} |"
            echo "| Backend / microservices | ${{ steps.filter.outputs.backend }} |"
            echo "| CI | ${{ steps.filter.outputs.ci }} |"
            echo
            echo "Scope: \`${{ steps.scope.outputs.scope }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-smoke:
    name: Stage 1 - Frontend Smoke
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.scope == 'full' ||
      needs.detect-changes.outputs.scope == 'frontend' ||
      needs.detect-changes.outputs.scope == 'quick' ||
      needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: SnapFlow/Front-Snap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript contract
        run: npx tsc --noEmit

      - name: Lint frontend
        continue-on-error: true
        run: npm run lint

      - name: Build frontend
        if: needs.detect-changes.outputs.run_build == 'true'
        run: npm run build

      - name: Summary
        if: always()
        run: |
          echo "| Stage | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend smoke | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  frontend-tests:
    name: Stage 2 - Frontend Tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-smoke]
    if: >
      needs.detect-changes.outputs.scope == 'full' ||
      needs.detect-changes.outputs.scope == 'frontend' ||
      needs.detect-changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: audit-reporting
            pattern: "auditMapper.axis auditPdfData auditDetailsCsvEvidenceCleanup activityPdfContract activityReportScoreRemoval activityMeeting remainingTicketsCleanup dateFormat ecoWording clientsProjectGrouping activityPdfBrandingSettings rgpdWording perimeterTerminology siteLogoPdfContract siteLogoResolver clientLogoSidebar"
          - group: form-workflows
            pattern: "formTester"
          - group: project-sync
            pattern: "projectUrls projectSync example"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: SnapFlow/Front-Snap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest group with coverage
        run: |
          mkdir -p .coverage-summary
          npx vitest run ${{ matrix.pattern }} --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: Write coverage summary
        if: always()
        env:
          FRONTEND_GROUP: ${{ matrix.group }}
          FRONTEND_PATTERN: ${{ matrix.pattern }}
        run: |
          mkdir -p .coverage-summary
          node <<'NODE'
          const fs = require('node:fs');
          const group = process.env.FRONTEND_GROUP || 'unknown';
          const pattern = process.env.FRONTEND_PATTERN || '';
          const path = 'coverage/coverage-summary.json';
          let total = 'not generated';
          let statements = '';
          let branches = '';
          let functions = '';
          let lines = '';
          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const t = data.total || {};
            statements = t.statements?.pct ?? '';
            branches = t.branches?.pct ?? '';
            functions = t.functions?.pct ?? '';
            lines = t.lines?.pct ?? '';
            total = lines;
          }
          const md = [
            `| Frontend | ${group} | ${total} | ${statements} | ${branches} | ${functions} | ${lines} | \`${pattern}\` |`,
          ].join('\n') + '\n';
          fs.writeFileSync(`.coverage-summary/frontend-${group}.md`, md);
          NODE

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary-frontend-${{ matrix.group }}
          path: ${{ env.FRONTEND_DIR }}/.coverage-summary/*.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "| Frontend group | Status | Pattern |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.group }} | ${{ job.status }} | \`${{ matrix.pattern }}\` |" >> "$GITHUB_STEP_SUMMARY"

  frontend-all-tests:
    name: Stage 2.5 - Frontend Full Vitest
    runs-on: ubuntu-latest
    needs: [detect-changes, frontend-tests]
    if: needs.detect-changes.outputs.scope == 'full'
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: SnapFlow/Front-Snap/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run complete Vitest suite with coverage
        run: |
          mkdir -p .coverage-summary
          npx vitest run --coverage --coverage.reporter=json-summary --coverage.reporter=text-summary

      - name: Write coverage summary
        if: always()
        run: |
          mkdir -p .coverage-summary
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'coverage/coverage-summary.json';
          let total = 'not generated';
          let statements = '';
          let branches = '';
          let functions = '';
          let lines = '';
          if (fs.existsSync(path)) {
            const data = JSON.parse(fs.readFileSync(path, 'utf8'));
            const t = data.total || {};
            statements = t.statements?.pct ?? '';
            branches = t.branches?.pct ?? '';
            functions = t.functions?.pct ?? '';
            lines = t.lines?.pct ?? '';
            total = lines;
          }
          const md = `| Frontend | full-vitest | ${total} | ${statements} | ${branches} | ${functions} | ${lines} | \`npx vitest run --coverage\` |\n`;
          fs.writeFileSync('.coverage-summary/frontend-full-vitest.md', md);
          NODE

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary-frontend-full-vitest
          path: ${{ env.FRONTEND_DIR }}/.coverage-summary/*.md
          if-no-files-found: ignore

  go-tests:
    name: Stage 3 - Go Tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.scope == 'full' ||
      needs.detect-changes.outputs.scope == 'backend' ||
      needs.detect-changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: v3-scanner-go
            path: SnapFlow/V3-Microservices/v3-scanner-go
          - service: v3-cli
            path: SnapFlow/V3-Microservices/v3-cli
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: ${{ matrix.path }}/go.sum

      - name: Run Go tests with coverage
        run: |
          mkdir -p .coverage-summary
          go test ./... -covermode=atomic -coverprofile=coverage.out
          go tool cover -func=coverage.out | tee coverage.txt

      - name: Write coverage summary
        if: always()
        shell: bash
        run: |
          mkdir -p .coverage-summary
          total="$(awk '/^total:/ {print $3}' coverage.txt 2>/dev/null || true)"
          total="${total:-not generated}"
          echo "| Go | ${{ matrix.service }} | $total |  |  |  | $total | \`go test ./... -coverprofile=coverage.out\` |" > ".coverage-summary/go-${{ matrix.service }}.md"

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary-go-${{ matrix.service }}
          path: ${{ matrix.path }}/.coverage-summary/*.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "| Go service | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.service }} | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  python-tests:
    name: Stage 4 - Python Tests (${{ matrix.service }})
    runs-on: ubuntu-22.04
    needs: detect-changes
    if: >
      needs.detect-changes.outputs.scope == 'full' ||
      needs.detect-changes.outputs.scope == 'backend' ||
      needs.detect-changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: aggregator
            path: SnapFlow/V3-Microservices/v3-aggregator
            command: python -m pytest tests -q
          - service: nlp-worker
            path: SnapFlow/V3-Microservices/v3-nlp-worker
            command: python -m pytest tests -q
          - service: visual-regression
            path: SnapFlow/V3-Microservices/v3-visual-regression
            command: python -m pytest tests -q
          - service: form-executor
            path: SnapFlow/V3-Microservices/v3-form-executor
            command: python -m pytest tests -q
    defaults:
      run:
        working-directory: ${{ matrix.path }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ${{ matrix.path }}/requirements.txt

      - name: Install service dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi
          python -m pip install "pytest==8.3.5" "pytest-asyncio==0.24.0" "pytest-cov==5.0.0" "httpx==0.27.2"

      - name: Install Playwright browsers
        if: contains(matrix.service, 'visual') || contains(matrix.service, 'form-executor')
        run: python -m playwright install --with-deps chromium

      - name: Run pytest with coverage
        run: |
          mkdir -p .coverage-summary
          python -m pytest tests -q --cov=. --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json

      - name: Write coverage summary
        if: always()
        run: |
          mkdir -p .coverage-summary
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          service = os.environ.get("PYTHON_SERVICE", "unknown")
          command = os.environ.get("PYTHON_COMMAND", "python -m pytest tests -q --cov=.")
          path = Path("coverage.json")
          total = statements = branches = functions = lines = "not generated"
          if path.exists():
              data = json.loads(path.read_text(encoding="utf-8"))
              totals = data.get("totals", {})
              line_pct = totals.get("percent_covered_display", totals.get("percent_covered", ""))
              total = lines = str(line_pct)
              statements = str(line_pct)
              branches = str(totals.get("percent_covered_display", totals.get("percent_covered", "")))
              functions = ""
          row = f"| Python | {service} | {total} | {statements} | {branches} | {functions} | {lines} | `{command}` |\n"
          Path(f".coverage-summary/python-{service}.md").write_text(row, encoding="utf-8")
          PY
        env:
          PYTHON_SERVICE: ${{ matrix.service }}
          PYTHON_COMMAND: ${{ matrix.command }}

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-summary-python-${{ matrix.service }}
          path: ${{ matrix.path }}/.coverage-summary/*.md
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          echo "| Python service | Status | Command |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.service }} | ${{ job.status }} | \`${{ matrix.command }}\` |" >> "$GITHUB_STEP_SUMMARY"

  security-checks:
    name: Stage 5 - Security Checks
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.run_security == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Secret pattern scan
        shell: bash
        run: |
          set -euo pipefail
          ! git grep -n -E '(BEGIN (RSA|OPENSSH|PRIVATE) KEY|postgres(ql)?://[^[:space:]/:@]+:[^[:space:]${}@]{12,}@|SUPABASE_(SERVICE_ROLE|ANON)_KEY=eyJ|REDMINE_API_KEY=[A-Za-z0-9_=-]{24,})' -- \
            ':!SnapFlow/Front-Snap/package-lock.json' \
            ':!**/*.md' \
            ':!**/*.example' \
            ':!**/*.template' \
            ':!SnapFlow/V3-Microservices/.env.preprod' \
            ':!SnapFlow/k8s/01-infra/postgres/secret.yaml'

      - name: Setup Node for npm audit
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: SnapFlow/Front-Snap/package-lock.json

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: NPM audit
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm audit --audit-level=high

      - name: Summary
        if: always()
        run: |
          echo "| Security check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Secret/dependency scan | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - frontend-smoke
      - frontend-tests
      - frontend-all-tests
      - go-tests
      - python-tests
      - security-checks
    if: always()
    steps:
      - name: Download coverage summaries
        uses: actions/download-artifact@v6
        continue-on-error: true
        with:
          pattern: coverage-summary-*
          path: coverage-summaries
          merge-multiple: true

      - name: Final test table
        shell: bash
        run: |
          {
            echo "## Test Results"
            echo
            echo "| Stage | Result |"
            echo "|---|---:|"
            echo "| Detect Changes | ${{ needs.detect-changes.result }} |"
            echo "| Frontend Smoke | ${{ needs.frontend-smoke.result }} |"
            echo "| Frontend Matrix | ${{ needs.frontend-tests.result }} |"
            echo "| Frontend Full Vitest | ${{ needs.frontend-all-tests.result }} |"
            echo "| Go Matrix | ${{ needs.go-tests.result }} |"
            echo "| Python Matrix | ${{ needs.python-tests.result }} |"
            echo "| Security Checks | ${{ needs.security-checks.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Final coverage table
        shell: bash
        run: |
          {
            echo
            echo "## Coverage Summary"
            echo
            echo "| Runtime | Suite / Service | Total / Lines % | Statements % | Branches % | Functions % | Lines % | Command |"
            echo "|---|---|---:|---:|---:|---:|---:|---|"
            if compgen -G "coverage-summaries/*.md" > /dev/null; then
              cat coverage-summaries/*.md
            else
              echo "| unavailable | no coverage artifacts found |  |  |  |  |  |  |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if required stages failed
        shell: bash
        run: |
          failed=0
          for result in \
            "${{ needs.detect-changes.result }}" \
            "${{ needs.frontend-smoke.result }}" \
            "${{ needs.frontend-tests.result }}" \
            "${{ needs.frontend-all-tests.result }}" \
            "${{ needs.go-tests.result }}" \
            "${{ needs.python-tests.result }}"; do
            case "$result" in
              failure|cancelled) failed=1 ;;
            esac
          done
          exit "$failed"

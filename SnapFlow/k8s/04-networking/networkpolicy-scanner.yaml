apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scanner-netpol
  namespace: snapflow-prod
spec:
  podSelector:
    matchLabels:
      app: v3-scanner-go
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: snapflow-infra
      podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: browserless
    ports:
    - port: 3000
  - to:
    - ipBlock:
        cidr: 0.0.0.0/0
    ports:
    - port: 80
    - port: 443
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP

# Deploy-ready mode for current code: CPU-based KEDA (no Redis queue dependency)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: v3-scanner-scaledobject
  namespace: snapflow-prod
spec:
  scaleTargetRef:
    name: v3-scanner-go
  pollingInterval: 15
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
  - type: cpu
    metricType: Utilization
    metadata:
      value: "75"

services:
  # ─── PostgreSQL (Lightweight) ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: snapflow_v3
      POSTGRES_USER: snapflow
      POSTGRES_PASSWORD: snapflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapflow -d snapflow_v3"]
      interval: 3s
      timeout: 3s
      retries: 10

  # ─── Go Scanner API ───────────────────────────────────────────────────
  scanner:
    build:
      context: ./v3-scanner-go
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      v3-browser-pool:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: snapflow_v3
      DB_USER: snapflow
      DB_PASS: snapflow
      CHROME_NO_SANDBOX: "true"
      BROWSER_POOL_URL: http://v3-browser-pool:8084
      BROWSER_POOL_TIMEOUT_MS: "90000"
      SCANNER_REQUEST_TIMEOUT_SEC: "30"
      RENDERED_DISCOVERY_MAX_PAGES: "8"
      RENDERED_DISCOVERY_MAX_LINKS: "30"
      RENDERED_DISCOVERY_TIMEOUT_MS: "20000"
      ENABLE_OBSCURA_PARALLEL_DISCOVERY: "true"
      OBSCURA_DISCOVERY_MAX_LINKS_PER_PAGE: "30"
      OBSCURA_PARALLEL_DISCOVERY_JOIN_MS: "1500"
      ENABLE_PORT_SCAN: "true"
      PORT_SCAN_TIMEOUT_MS: "900"
      PORT_SCAN_PORTS: "21,22,25,53,80,443,3306,5432,6379,8080,8443,3389"

  # ─── NLP Python Worker ──────────────────────────────────────────────
  nlp-worker:
    build:
      context: ./v3-nlp-worker
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: snapflow_v3
      DB_USER: snapflow
      DB_PASS: snapflow
      POLL_INTERVAL: "3"
    restart: unless-stopped

  # ─── Aggregator API ─────────────────────────────────────────────────
  aggregator:
    build:
      context: ./v3-aggregator
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: snapflow_v3
      DB_USER: snapflow
      DB_PASS: snapflow
      SCANNER_API_URL: http://scanner:8081
      VISUAL_REGRESSION_API_URL: http://v3-visual-regression:8083
      BROWSER_POOL_URL: http://v3-browser-pool:8084
    restart: unless-stopped

  # ─── Browser Pool ─────────────────────────────────────────────────────
  v3-browser-pool:
    build: ./v3-browser-pool
    container_name: v3-browser-pool
    ports:
      - "8084:8084"
    environment:
      CHROME_NO_SANDBOX: "true"
      BROWSER_POOL_CONCURRENCY: "24"
      BROWSER_POOL_RECYCLE_AFTER: "80"
      BROWSER_POOL_DEFAULT_TIMEOUT_MS: "30000"
      BROWSER_POOL_ACQUIRE_TIMEOUT_S: "20"
      BROWSER_POOL_SCREENSHOT_WAIT_UNTIL: "domcontentloaded"
      BROWSER_POOL_SCREENSHOT_SETTLE_MS: "1000"
      BROWSER_POOL_SCREENSHOT_LOAD_STATE_TIMEOUT_MS: "8000"
      BROWSER_POOL_RENDER_WAIT_UNTIL: "domcontentloaded"
      BROWSER_POOL_RENDER_SETTLE_MS: "1000"
      ENABLE_OBSCURA_DISCOVERY: ${ENABLE_OBSCURA_DISCOVERY:-true}
      OBSCURA_RENDER_ENABLED: ${OBSCURA_RENDER_ENABLED:-true}
      OBSCURA_MAX_SESSIONS: "48"
      OBSCURA_DISCOVERY_CONCURRENCY: "24"
      OBSCURA_RENDER_FALLBACK_CONCURRENCY: "24"
      ENABLE_OBSCURA_FORM_EXECUTION: "false"
      ENABLE_OBSCURA_FORM_FUZZING: "false"
      OBSCURA_CDP_URL: http://obscura:9222
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Real browser worker for approved Form Tester scenario versions.
  # The queue is stored in Supabase PostgreSQL, not in the scan database above.
  v3-form-executor:
    build:
      context: ./v3-form-executor
      dockerfile: Dockerfile
    container_name: v3-form-executor
    profiles: ["form-tester"]
    ports:
      - "8085:8085"
    environment:
      FORM_EXECUTOR_DATABASE_URL: ${FORM_EXECUTOR_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:54322/postgres}
      SUPABASE_URL: ${FORM_EXECUTOR_SUPABASE_URL:-http://host.docker.internal:54321}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      FORM_EXECUTOR_ARTIFACT_BUCKET: ${FORM_EXECUTOR_ARTIFACT_BUCKET:-form-test-artifacts}
      FORM_EXECUTOR_CONCURRENCY: ${FORM_EXECUTOR_CONCURRENCY:-3}
      FORM_EXECUTOR_ARTIFACT_RETENTION_DAYS: ${FORM_EXECUTOR_ARTIFACT_RETENTION_DAYS:-30}
      FORM_EXECUTOR_ARTIFACT_CLEANUP_INTERVAL_SECONDS: ${FORM_EXECUTOR_ARTIFACT_CLEANUP_INTERVAL_SECONDS:-3600}
      FORM_EXECUTOR_POLL_INTERVAL: "1"
      FORM_EXECUTOR_TIMEOUT_MS: "90000"
      FORM_EXECUTOR_TIMEOUT_MAX_MS: "240000"
      FORM_EXECUTOR_NODE_TIMEOUT_MS: "15000"
      FORM_EXECUTOR_NAVIGATION_TIMEOUT_MS: "30000"
      FORM_EXECUTOR_SETTLE_MS: "500"
      FORM_EXECUTOR_HEADLESS: "true"
      CHROME_NO_SANDBOX: "true"
      FORM_EXECUTOR_2CAPTCHA_API_KEY: ${FORM_EXECUTOR_2CAPTCHA_API_KEY:-}
      FORM_EXECUTOR_CAPTCHA_TIMEOUT_S: "120"
      FORM_EXECUTOR_CAPTCHA_POLL_INTERVAL_S: "5"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - form_test_artifacts:/tmp/form-test-artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  obscura:
    image: ${OBSCURA_IMAGE:-h4ckf0r0day/obscura:latest}
    profiles: ["obscura"]
    environment:
      CHROME_NO_SANDBOX: "true"
    restart: unless-stopped

  # ─── Visual Regression Microservice ─────────────────────────────────
  v3-visual-regression:
    build: ./v3-visual-regression
    container_name: v3-visual-regression
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: postgresql://snapflow:snapflow@db:5432/snapflow_v3
      VISUAL_REGRESSION_ENABLED: "true"
      CHROME_NO_SANDBOX: "true"
      BROWSER_POOL_URL: http://v3-browser-pool:8084
      VISUAL_SCREENSHOT_MAX_CONCURRENCY: "10"
      SCREENSHOT_WAIT_UNTIL: "domcontentloaded"
      SCREENSHOT_SETTLE_MS: "1000"
      SCREENSHOT_LOAD_STATE_TIMEOUT_MS: "8000"
    depends_on:
      db:
        condition: service_healthy
      v3-browser-pool:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  form_test_artifacts:

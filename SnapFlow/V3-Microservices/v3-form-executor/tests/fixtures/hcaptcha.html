<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>hCaptcha fixture</title>
  </head>
  <body>
    <h1>hCaptcha Protected Form</h1>
    <form action="/submit" method="POST">
      <label>Email <input name="email" type="email"></label>
      <div class="h-captcha" data-sitekey="10000000-ffff-ffff-ffff-000000000001"></div>
      <button type="submit">Submit</button>
    </form>
    <textarea class="h-captcha-response" style="display:none"></textarea>
  </body>
</html>

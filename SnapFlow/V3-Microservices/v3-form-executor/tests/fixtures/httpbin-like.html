<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>httpbin-like form fixture</title>
  </head>
  <body>
    <main>
      <h1>Pizza order</h1>
      <form id="pizza-form">
        <label>Name <input name="custname" required></label>
        <label>Phone <input name="custtel" type="tel"></label>
        <label>Email <input name="custemail" type="email"></label>
        <label><input name="size" type="radio" value="small"> Small</label>
        <label><input name="size" type="radio" value="medium"> Medium</label>
        <label><input name="size" type="radio" value="large"> Large</label>
        <label><input name="topping" type="checkbox" value="bacon"> Bacon</label>
        <label><input name="topping" type="checkbox" value="cheese"> Cheese</label>
        <label><input name="topping" type="checkbox" value="onion"> Onion</label>
        <label>Delivery time <input name="delivery" type="time" min="11:00" max="21:00" step="900"></label>
        <textarea name="comments"></textarea>
        <button type="submit">Submit order</button>
      </form>
      <pre id="result"></pre>
    </main>
    <script>
      document.querySelector("#pizza-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const data = new FormData(event.currentTarget);
        document.querySelector("#result").textContent = `Order received for ${data.get("custname")} size=${data.get("size")}`;
      });
    </script>
  </body>
</html>

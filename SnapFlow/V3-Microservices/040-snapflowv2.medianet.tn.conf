<VirtualHost *:80>
    ServerName snapflowv2.medianet.tn

    ProxyPreserveHost On

    # ─── API / Aggregator ──────────────────────────────────────────────
    # More specific path must come before the / catch-all
    <Location /api/>
        ProxyPass http://127.0.0.1:8080/api/
        ProxyPassReverse http://127.0.0.1:8080/api/
    </Location>

    # ─── Frontend (React SPA via Nginx) ─────────────────────────────────
    <Location />
        ProxyPass http://127.0.0.1:3000/
        ProxyPassReverse http://127.0.0.1:3000/
    </Location>

    # ─── Logs ───────────────────────────────────────────────────────────
    ErrorLog ${APACHE_LOG_DIR}/snapflowv2-error.log
    CustomLog ${APACHE_LOG_DIR}/snapflowv2-access.log combined
</VirtualHost>
